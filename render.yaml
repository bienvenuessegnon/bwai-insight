services:
  - type: web
    name: bwai-insight
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bwai-insight-db
          property: connectionString

databases:
  - name: bwai-insight-db
    databaseName: bwai_insight
    plan: free
    region: frankfurt
